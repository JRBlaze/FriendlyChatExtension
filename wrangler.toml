name               = "friendly-chat-kick-proxy"
main               = "cloudflare-worker.js"
compatibility_date = "2026-05-01"
workers_dev        = true

# Deploying from this folder replaces the worker already running at
#   https://friendly-chat-kick-proxy.jrblaze.workers.dev
# under the same name, so the URL does not change and the extension needs no
# reconfiguring.
#
# This folder is the only place that worker is deployed from. It is shared: the
# Friendly Chat desktop app (JRBlaze/FriendlyChat) uses the same worker, and so
# the same Kick application, through /kick-config, /kick-token and /kick-refresh,
# which must keep answering as they do. That repository once carried an older
# copy of this worker under this same name, which would have replaced this one —
# /twitch-config, /kick-authorize and /kick-callback gone, and the logging
# settings below with them — had anybody run `wrangler deploy` there.
#
# Secrets live outside the code and survive a redeploy. They only need setting
# if they have never been set, or if the application behind one changes:
#   wrangler secret put KICK_CLIENT_ID
#   wrangler secret put KICK_CLIENT_SECRET
#   wrangler secret put TWITCH_CLIENT_ID
#
# TWITCH_CLIENT_ID is the Twitch application's client id. It is not a secret in
# the cryptographic sense — it travels in every authorise URL — but holding it
# here keeps it out of the published source and lets it be changed without
# shipping an extension update. The extension asks for it at sign-in.
#
# Then:
#   wrangler deploy

# Settings that were only ever set in the dashboard. They are written down here
# because wrangler treats a config file as the whole truth: anything this file
# does not mention is deployed as its default, so a plain `wrangler deploy` was
# about to turn the Workers logs off and preview URLs on, neither of which
# anybody asked for. Note that preview_urls is not workers_dev above — it
# governs the per-version preview addresses, not the one the extension calls.
preview_urls = false

# Off: sign-in addresses carry one-time Kick codes, and the privacy policy
# promises they are not kept anywhere.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
